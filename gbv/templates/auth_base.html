{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Staff — Amani{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/landing.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/staff.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="staff-body staff-body--auth">

  <main class="auth-shell">
    <div class="auth-card">
      <a href="{% url 'public:landing' %}" class="auth-brand">Amani <span>Staff</span></a>
      {% if messages %}
        <div class="page-messages page-messages--auth">
          {% for message in messages %}
            <p class="msg msg--{{ message.tags }}">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </div>
    <p class="auth-footnote"><a href="{% url 'public:landing' %}">← Back to the public site</a></p>
  </main>

  {% block extra_js %}{% endblock %}
</body>
</html>
