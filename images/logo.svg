<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">

  <!-- MORTARBOARD (graduation cap) — large and prominent -->
  <!-- Top flat board - wide -->
  <polygon points="100,10 20,50 100,75 180,50" fill="#FFFFFF"/>
  <!-- Board front edge -->
  <polygon points="20,50 100,75 100,84 20,59" fill="#FFFFFF" opacity="0.85"/>
  <!-- Board right edge -->
  <polygon points="100,75 180,50 180,59 100,84" fill="#FFFFFF" opacity="0.65"/>
  <!-- Tassel cord from center -->
  <line x1="100" y1="50" x2="155" y2="50" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Tassel string hanging -->
  <line x1="155" y1="50" x2="155" y2="72" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Tassel end -->
  <path d="M150 70 L155 80 L160 70" fill="#FFFFFF"/>
  <line x1="155" y1="80" x2="155" y2="88" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="155" cy="88" r="2.5" fill="#FFFFFF"/>

  <!-- LIGHTBULB — middle section -->
  <path d="M100 92 C65 92 42 116 42 142 C42 160 54 174 68 182 L68 195 C68 198 71 200 74 200 L126 200 C129 200 132 198 132 195 L132 182 C146 174 158 160 158 142 C158 116 135 92 100 92 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bulb base rings -->
  <rect x="72" y="200" width="56" height="8" rx="3" fill="#FFFFFF"/>
  <rect x="77" y="210" width="46" height="7" rx="3" fill="#FFFFFF" opacity="0.75"/>
  <rect x="82" y="219" width="36" height="6" rx="3" fill="#FFFFFF" opacity="0.55"/>

  <!-- PEN NIB — bottom -->
  <path d="M100 225 L82 242 C87 248 93 252 100 254 C107 252 113 248 118 242 Z" 
        fill="#FFFFFF"/>
  <!-- Pen slit -->
  <line x1="100" y1="232" x2="100" y2="250" stroke="#1a5276" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pen tip -->
  <circle cx="100" cy="254" r="3" fill="#FFFFFF"/>
</svg>