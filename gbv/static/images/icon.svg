<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A"/>
      <stop offset="100%" stop-color="#D71920"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Megaphone body -->
  <g transform="translate(256,256)">
    <!-- Horn / cone -->
    <path d="M-8,-68 L8,-68 L72,-8 L72,8 L8,68 L-8,68 Z" fill="#FFFFFF" stroke="none"/>
    <!-- Base / handle -->
    <rect x="-20" y="-52" width="20" height="104" rx="6" ry="6" fill="#FFFFFF"/>
    <!-- Sound waves -->
    <path d="M92,-28 C108,-16 108,16 92,28" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M108,-48 C132,-28 132,28 108,48" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
